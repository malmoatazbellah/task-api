apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-api-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/malmoatazbellah/task-api.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: task-api-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true