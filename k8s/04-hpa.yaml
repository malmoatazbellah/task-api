# STRETCH GOAL — Horizontal Pod Autoscaler.
# Requires metrics-server in the cluster. Install it first, e.g.:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# Then: kubectl apply -f k8s/optional/hpa.yaml
# Generate load and watch: kubectl get hpa -n task-api -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-api
  namespace: task-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
