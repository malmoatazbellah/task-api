# type: LoadBalancer makes AWS create a public load balancer for the app.
# Stretch goal: install the AWS Load Balancer Controller and use an Ingress (ALB) instead.
apiVersion: v1
kind: Service
metadata:
  name: task-api
  namespace: task-api
spec:
  type: LoadBalancer
  selector:
    app: task-api
  ports:
    - name: http
      port: 80
      targetPort: http
