apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: task-api-staging

resources:
  - ../../base

images:
  - name: task-api
    newName: task-api
    newTag: dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: task-api
      spec:
        template:
          spec:
            containers:
              - name: task-api
                env:
                  - name: APP_VERSION
                    value: "dev"
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: task-api-config
      data:
        APP_ENV: "staging"