resources:
- ../../base

images:
- name: task-api
  newName: 349631302690.dkr.ecr.eu-central-1.amazonaws.com/capstone-dev-task-api
  newTag: 97faf34ae67a51eea3b35c0405d258f831c9c9a1

patches:
