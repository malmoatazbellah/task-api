# =============================================================================
# Application pipeline
#   1. test          → npm ci + unit tests
#   2. lint-docker   → hadolint checks YOUR Dockerfile
#   3. build-push    → docker build, Trivy scan, push to ECR
#   4. deploy-staging   → kubectl apply to EKS (task-api-staging namespace, no approval)
#   5. deploy           → kubectl apply to EKS (task-api namespace, production approval)
# =============================================================================
name: App CI/CD

on:
  pull_request:
    paths: ["app/**", "k8s/**", ".github/workflows/app-cicd.yml"]
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", ".github/workflows/app-cicd.yml"]
  workflow_call:         # called by terraform.yml after a successful apply
  workflow_dispatch:

permissions:
  id-token: write      # required for AWS OIDC
  contents: read
  pull-requests: write # required for hadolint PR annotations

concurrency:
  group: app-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}     # e.g. capstone-dev-task-api
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }} # e.g. capstone-dev
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  lint-docker:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

  build-push:
    name: Build, scan & push image
    needs: [test, lint-docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ECR repository to exist
        run: |
          echo "Waiting for ECR repository '${ECR_REPOSITORY}' to exist..."
          for i in $(seq 1 20); do
            if aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "${AWS_REGION}" > /dev/null 2>&1; then
              echo "ECR repository found."; exit 0
            fi
            echo "Attempt ${i}/20 — not found yet, waiting 30 s..."
            sleep 30
          done
          echo "::error::ECR repository '${ECR_REPOSITORY}' did not appear after 10 minutes."; exit 1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Compute image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image }}" app/

      - name: Smoke-test the container locally
        run: |
          docker run -d --name smoke -p 3000:3000 "${{ steps.meta.outputs.image }}"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 2
          done
          echo "Container did not become healthy"; docker logs smoke; exit 1

      - name: Check image runs as non-root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' "${{ steps.meta.outputs.image }}")
          echo "Image user: '${user}'"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::Image must not run as root (set USER in the Dockerfile)"; exit 1
          fi

      - name: Scan image with Trivy (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "${{ steps.meta.outputs.image }}"

      - name: Push image
        run: docker push "${{ steps.meta.outputs.image }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 #v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Sign the image
        run: |
          digest_ref=$(docker inspect --format '{{index .RepoDigests 0}}' "${{steps.meta.outputs.image}}")
          cosign sign --yes "$digest_ref"

  deploy-staging:
    name: Deploy to staging
    needs: build-push
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Render manifests
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          cd k8s/overlays/staging

          kustomize edit set image task-api="$IMAGE"

          VERSION="${IMAGE_TAG:0:7}"

          printf 'apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: task-api\nspec:\n  template:\n    spec:\n      containers:\n        - name: task-api\n          env:\n            - name: APP_VERSION\n              value: "%s"\n' "$VERSION" > version-patch.yaml

          kustomize edit remove patch --path version-patch.yaml 2>/dev/null || true
          kustomize edit add patch --path version-patch.yaml
          kustomize build .

      - name: Ensure staging namespace exists
        run: kubectl apply -f k8s/overlays/staging/namespace.yaml

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/staging/

      - name: Wait for rollout (auto-rollback on failure)
        run: |
          if ! kubectl rollout status deployment/task-api -n task-api-staging --timeout=180s; then
            echo "::error::Staging rollout failed — rolling back"
            kubectl describe pods -n task-api-staging -l app=task-api | tail -50
            kubectl rollout undo deployment/task-api -n task-api-staging
            exit 1
          fi

      - name: Smoke test (staging)
        run: |
          for i in $(seq 1 30); do
            host=$(kubectl get svc task-api -n task-api-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$host" ] && curl -fsS "http://$host/healthz"; then
              echo
              echo "### 🧪 Staging: http://$host" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for staging load balancer DNS... ($i/30)"; sleep 10
          done
          echo "::warning::Staging load balancer not reachable yet"

  deploy:
    name: Deploy to production
    needs: [build-push, deploy-staging]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Render manifests
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          cd k8s/overlays/production

          kustomize edit set image task-api="$IMAGE"

          VERSION="${IMAGE_TAG:0:7}"

          printf 'apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: task-api\nspec:\n  template:\n    spec:\n      containers:\n        - name: task-api\n          env:\n            - name: APP_VERSION\n              value: "%s"\n' "$VERSION" > version-patch.yaml

          kustomize edit remove patch --path version-patch.yaml 2>/dev/null || true
          kustomize edit add patch --path version-patch.yaml
          kustomize build .

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 #v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Verify the image signature
        run: |
          cosign verify \
            --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/app-cicd.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ needs.build-push.outputs.image }}"

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/production/

      - name: Wait for rollout (auto-rollback on failure)
        run: |
          if ! kubectl rollout status deployment/task-api -n task-api --timeout=180s; then
            echo "::error::Rollout failed — rolling back"
            kubectl describe pods -n task-api -l app=task-api | tail -50
            kubectl rollout undo deployment/task-api -n task-api
            exit 1
          fi

      - name: Smoke test through the load balancer
        run: |
          for i in $(seq 1 30); do
            host=$(kubectl get svc task-api -n task-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$host" ] && curl -fsS "http://$host/healthz"; then
              echo
              echo "### 🚀 Deployed: http://$host" >> "$GITHUB_STEP_SUMMARY"
              curl -fsS "http://$host/"
              exit 0
            fi
            echo "Waiting for load balancer DNS... ($i/30)"; sleep 10
          done
          echo "::warning::Load balancer not reachable yet (new LBs can take a few minutes)"
