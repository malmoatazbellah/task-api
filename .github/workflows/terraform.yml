# =============================================================================
# Infrastructure pipeline
#   Pull request  -> fmt check, validate, plan (plan shown in the job summary)
#   Push to main  -> apply (requires approval on the "infrastructure" environment)
#   Manual run    -> plan / apply / destroy
# =============================================================================
name: Terraform (Infrastructure)

on:
  pull_request:
    paths: ["terraform/infra/**", "terraform/helm-values-monitoring.yaml", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/infra/**", "terraform/helm-values-monitoring.yaml", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

concurrency:
  group: terraform-infra   # never run two applies at once
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  WORKDIR: terraform/infra

jobs:
  plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.13"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            ${{ github.event.inputs.action == 'destroy' && '-destroy' || '' }} | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'plan')
    runs-on: ubuntu-latest
    environment: infrastructure   # add "Required reviewers" on this environment in GitHub

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.13"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}

      - name: Delete k8s workloads before destroy (removes ALBs so VPC subnets can be deleted)
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ github.workspace }}
        run: |
          if aws eks describe-cluster --region ${{ vars.AWS_REGION }} --name ${{ vars.EKS_CLUSTER_NAME }} > /dev/null 2>&1; then
            aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.EKS_CLUSTER_NAME }}
            kubectl delete -f k8s/argocd/ --ignore-not-found --wait=true --timeout=60s || true
            kubectl delete -k k8s/overlays/production/ --ignore-not-found
            kubectl delete -k k8s/overlays/staging/ --ignore-not-found
            kubectl delete namespace argocd --ignore-not-found --timeout=60s || \
              kubectl patch namespace argocd -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
            kubectl delete namespace monitoring --ignore-not-found --timeout=60s || \
              kubectl patch namespace monitoring -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          else
            echo "EKS cluster not found, skipping k8s cleanup."
          fi
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ vars.EKS_CLUSTER_NAME }}-vpc" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Waiting for load balancers in VPC $VPC_ID to be deleted..."
            force_deleted=false
            for i in $(seq 1 24); do
              lb_arns=$(aws elbv2 describe-load-balancers \
                --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
                --output text)
              if [ -z "$lb_arns" ] || [ "$lb_arns" = "None" ]; then
                echo "All load balancers gone."
                break
              fi
              echo "Still load balancer(s) present... ($i/24)"
              if [ "$i" -ge 20 ] && [ "$force_deleted" = "false" ]; then
                echo "Force-deleting remaining load balancers..."
                for arn in $lb_arns; do
                  aws elbv2 delete-load-balancer --load-balancer-arn "$arn" 2>/dev/null || true
                done
                force_deleted=true
              fi
              sleep 15
            done
            # After force-delete, wait up to 3 more minutes for ENIs to release
            if [ "$force_deleted" = "true" ]; then
              echo "Waiting for ENIs to release after force-delete..."
              for i in $(seq 1 12); do
                lb_arns=$(aws elbv2 describe-load-balancers \
                  --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
                  --output text)
                if [ -z "$lb_arns" ] || [ "$lb_arns" = "None" ]; then
                  echo "All load balancers gone."
                  break
                fi
                echo "Still waiting for ENIs... ($i/12)"
                sleep 15
              done
            fi
          else
            echo "VPC not found, skipping load balancer wait."
          fi

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      - name: Show outputs
        if: github.event.inputs.action != 'destroy'
        run: |
          {
            echo '### Terraform outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cluster services and Argo CD applications
        if: github.event.inputs.action != 'destroy'
        working-directory: ${{ github.workspace }}
        run: |
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.EKS_CLUSTER_NAME }}

          kubectl apply -f k8s/overlays/production/namespace.yaml
          kubectl apply -f k8s/overlays/staging/namespace.yaml

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ vars.EKS_CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --wait \
            --timeout 5m

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus prometheus-community/kube-prometheus-stack \
            --version 70.4.2 \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 10m \
            -f terraform/helm-values-monitoring.yaml
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/05-servicemonitor.yaml
          kubectl apply -f k8s/06-grafana-ingress.yaml

          helm repo add argo https://argoproj.github.io/argo-helm --force-update
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --version 10.19.1 \
            --namespace argocd \
            --create-namespace \
            --wait \
            --timeout 10m

          kubectl wait --for=condition=Established \
            crd/applications.argoproj.io \
            --timeout=120s
          kubectl rollout status statefulset/argocd-application-controller \
            --namespace argocd \
            --timeout=300s
          kubectl apply -f k8s/argocd/

          for i in $(seq 1 30); do
            host=$(kubectl get ingress grafana -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$host" ]; then
              echo "### 📊 Grafana: http://$host  (admin / capstone-admin)" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "Waiting for Grafana ALB DNS... ($i/30)"; sleep 10
          done